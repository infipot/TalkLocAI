[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice_ai"
version = "0.1.0"
dependencies = [
    "sounddevice",
    "numpy",
    "soundfile",
    "faster-whisper",
    "pyttsx3",
    "openai",
    "requests",
    "piper"
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["voice_ai*"]